services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: kov
      POSTGRES_USER: kov
      POSTGRES_PASSWORD: kov
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.11.5
    ports:
      - "16333:6333"

  minio:
    image: quay.io/minio/minio:RELEASE.2024-08-26T15-33-07Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "19000:9000"
      - "19001:9001"

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runner
    environment:
      KOV_CONFIG_PATH: /app/configs/e2e.yaml
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      minio:
        condition: service_started
    ports:
      - "18000:8000"
    command:
      [
        "sh",
        "-c",
        "alembic upgrade head && uvicorn apps.api.main:app --host 0.0.0.0 --port 8000",
      ]
  backup-once:
    build:
      context: .
      dockerfile: docker/backup.Dockerfile
    user: "0:0"   # ✅ FIX
    environment:
      KOV_CONFIG_PATH: ${KOV_CONFIG_PATH:-configs/dev.yaml}
      POSTGRES_DB: ${POSTGRES_DB:-kov}
      POSTGRES_USER: ${POSTGRES_USER:-kov}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kov}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-kov-artifacts}
      S3_REGION: ${S3_REGION:-us-east-1}
      BACKUP_RUN_ONCE: "1"
      BACKUP_KEEP_HOURS: ${BACKUP_KEEP_HOURS:-36}
      BACKUP_INTERVAL_MINUTES: ${BACKUP_INTERVAL_MINUTES:-120}
      BACKUP_INCLUDE_S3_DATA: ${BACKUP_INCLUDE_S3_DATA:-0}
      BACKUP_LOCAL_DIR: /backups
    volumes:
      - backups_data:/backups

  backup-restore:
    build:
      context: .
      dockerfile: docker/backup.Dockerfile
    user: "0:0"   # ✅ FIX
    entrypoint: ["python", "-m", "kov.backup.restore_cli"]
    environment:
      KOV_CONFIG_PATH: ${KOV_CONFIG_PATH:-configs/dev.yaml}
      POSTGRES_DB: ${POSTGRES_DB:-kov}
      POSTGRES_USER: ${POSTGRES_USER:-kov}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kov}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-kov-artifacts}
      S3_REGION: ${S3_REGION:-us-east-1}
    volumes:
      - backups_data:/backups
      - ./:/workspace:ro
