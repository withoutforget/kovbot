services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: kov
      POSTGRES_USER: kov
      POSTGRES_PASSWORD: kov
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.11.5
    ports:
      - "16333:6333"

  minio:
    image: quay.io/minio/minio:RELEASE.2024-08-26T15-33-07Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "19000:9000"
      - "19001:9001"

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runner
    environment:
      KOV_CONFIG_PATH: /app/configs/e2e.yaml
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      minio:
        condition: service_started
    ports:
      - "18000:8000"
    command: ["uvicorn", "apps.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
