services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kov}
      POSTGRES_USER: ${POSTGRES_USER:-kov}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kov}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.11.5
    ports:
      - "6333:6333"

  minio:
    image: quay.io/minio/minio:RELEASE.2024-08-26T15-33-07Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runner
    environment:
      KOV_CONFIG_PATH: ${KOV_CONFIG_PATH:-configs/dev.yaml}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      minio:
        condition: service_started
    ports:
      - "8000:8000"
    command: ["uvicorn", "apps.api.main:app", "--host", "0.0.0.0", "--port", "8000"]

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runner
    environment:
      KOV_CONFIG_PATH: ${KOV_CONFIG_PATH:-configs/dev.yaml}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      minio:
        condition: service_started
    command: ["python", "-m", "apps.worker.main"]

  bot:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runner
    environment:
      KOV_CONFIG_PATH: ${KOV_CONFIG_PATH:-configs/dev.yaml}
    env_file:
      - .env
    depends_on:
      api:
        condition: service_started
    command: ["python", "-m", "apps.bot.main"]
