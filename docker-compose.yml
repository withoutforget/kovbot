services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kov}
      POSTGRES_USER: ${POSTGRES_USER:-kov}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kov}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.11.5
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage

  minio:
    image: quay.io/minio/minio:RELEASE.2024-08-26T15-33-07Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runner
    restart: unless-stopped
    environment:
      KOV_CONFIG_PATH: ${KOV_CONFIG_PATH:-configs/dev.yaml}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    command:
      [
        "sh",
        "-c",
        "alembic upgrade head && uvicorn apps.api.main:app --host 0.0.0.0 --port 8000",
      ]

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runner
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "apps.worker.main"]

  bot:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runner
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    command: ["python", "-m", "apps.bot.main"]

  backup-once:
    build:
      context: .
      dockerfile: docker/backup.Dockerfile
    user: "0:0"   # ✅ FIX
    environment:
      BACKUP_LOCAL_DIR: /backups
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - backups_data:/backups

  backup-restore:
    build:
      context: .
      dockerfile: docker/backup.Dockerfile
    user: "0:0"   # ✅ FIX
    entrypoint: ["python", "-m", "kov.backup.restore_cli"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - backups_data:/backups
      - ./:/workspace:ro

volumes:
  postgres_data:
  qdrant_data:
  minio_data:
  backups_data: