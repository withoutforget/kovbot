services:
  postgres:
    networks:
      - internal

  qdrant:
    networks:
      - internal

  minio:
    networks:
      - internal

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: prod_runner
    environment:
      KOV_CONFIG_PATH: ${KOV_CONFIG_PATH:-configs/prod.yaml}
      POSTGRES_DB: ${POSTGRES_DB:-kov}
      POSTGRES_USER: ${POSTGRES_USER:-kov}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kov}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-kov-artifacts}
      S3_REGION: ${S3_REGION:-us-east-1}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
    restart: unless-stopped
    ports: []
    networks:
      - internal
    command:
      [
        "sh",
        "-c",
        "alembic upgrade head && uvicorn apps.api.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips '*' --workers 2",
      ]

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: prod_runner
    environment:
      KOV_CONFIG_PATH: ${KOV_CONFIG_PATH:-configs/prod.yaml}
      POSTGRES_DB: ${POSTGRES_DB:-kov}
      POSTGRES_USER: ${POSTGRES_USER:-kov}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kov}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-kov-artifacts}
      S3_REGION: ${S3_REGION:-us-east-1}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
    restart: unless-stopped
    networks:
      - internal
    depends_on:
      api:
        condition: service_started

  bot:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: prod_runner
    environment:
      KOV_CONFIG_PATH: ${KOV_CONFIG_PATH:-configs/prod.yaml}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    restart: unless-stopped
    networks:
      - internal

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/entrypoint.sh"]
    ports:
      - "80:80"
      - "8443:8443"
    networks:
      - public
      - internal

  backup-once:
    build:
      context: .
      dockerfile: docker/backup.Dockerfile
    user: "0:0"   # ✅ FIX
    restart: "no"
    environment:
      KOV_CONFIG_PATH: ${KOV_CONFIG_PATH:-configs/prod.yaml}
      POSTGRES_DB: ${POSTGRES_DB:-kov}
      POSTGRES_USER: ${POSTGRES_USER:-kov}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kov}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-kov-artifacts}
      S3_REGION: ${S3_REGION:-us-east-1}
      BACKUP_RUN_ONCE: "1"
      BACKUP_KEEP_HOURS: ${BACKUP_KEEP_HOURS:-36}
      BACKUP_INTERVAL_MINUTES: ${BACKUP_INTERVAL_MINUTES:-120}
      BACKUP_INCLUDE_S3_DATA: ${BACKUP_INCLUDE_S3_DATA:-0}
      BACKUP_LOCAL_DIR: /backups
      # Optional separate backup bucket:
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-backups}
      BACKUP_S3_ENDPOINT_URL: ${BACKUP_S3_ENDPOINT_URL:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-}
      BACKUP_S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY:-}
      BACKUP_S3_SECRET_KEY: ${BACKUP_S3_SECRET_KEY:-}
    volumes:
      - backups_data:/backups
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      minio:
        condition: service_started

  # Periodic backups (runs forever; `kov.backup.runner` schedules by `BACKUP_INTERVAL_MINUTES`).
  backup:
    build:
      context: .
      dockerfile: docker/backup.Dockerfile
    user: "0:0"   # ✅ FIX
    restart: unless-stopped
    environment:
      KOV_CONFIG_PATH: ${KOV_CONFIG_PATH:-configs/prod.yaml}
      POSTGRES_DB: ${POSTGRES_DB:-kov}
      POSTGRES_USER: ${POSTGRES_USER:-kov}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kov}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-kov-artifacts}
      S3_REGION: ${S3_REGION:-us-east-1}
      BACKUP_KEEP_HOURS: ${BACKUP_KEEP_HOURS:-36}
      BACKUP_INTERVAL_MINUTES: ${BACKUP_INTERVAL_MINUTES:-120}
      BACKUP_INCLUDE_S3_DATA: ${BACKUP_INCLUDE_S3_DATA:-0}
      BACKUP_LOCAL_DIR: /backups
      # Optional separate backup bucket:
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-backups}
      BACKUP_S3_ENDPOINT_URL: ${BACKUP_S3_ENDPOINT_URL:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-}
      BACKUP_S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY:-}
      BACKUP_S3_SECRET_KEY: ${BACKUP_S3_SECRET_KEY:-}
    volumes:
      - backups_data:/backups
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      minio:
        condition: service_started

  backup-restore:
    build:
      context: .
      dockerfile: docker/backup.Dockerfile
    user: "0:0"   # ✅ FIX
    entrypoint: ["python", "-m", "kov.backup.restore_cli"]
    environment:
      KOV_CONFIG_PATH: ${KOV_CONFIG_PATH:-configs/prod.yaml}
      POSTGRES_DB: ${POSTGRES_DB:-kov}
      POSTGRES_USER: ${POSTGRES_USER:-kov}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kov}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-kov-artifacts}
      S3_REGION: ${S3_REGION:-us-east-1}
    volumes:
      - backups_data:/backups
      - ./:/workspace:ro
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      minio:
        condition: service_started

networks:
  public:
  internal:
    internal: true

volumes:
  backups_data:
