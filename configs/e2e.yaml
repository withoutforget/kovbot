env: e2e
logging:
  level: INFO

postgres:
  dsn: postgresql+asyncpg://kov:kov@postgres:5432/kov

qdrant:
  url: http://qdrant:6333
  collection: kov_chunks
  vector_size: 64
  timeout_seconds: 30
  upsert_batch_size: 64

s3:
  endpoint_url: http://minio:9000
  access_key: minioadmin
  secret_key: minioadmin
  bucket: kov-artifacts
  region: us-east-1

rag_scan:
  pipeline_version: "1.0"
  chunking:
    mode: semantic
    max_chars: 600
    overlap_chars: 60

rag_search:
  pipeline_version: "1.0"
  planner:
    max_queries: 8
    use_llm: false
    model: ""
    max_tokens: 200
  retrieval:
    top_k_per_query: 5
    min_score: 0.0
  reranker:
    enabled: true
    mode: list
    top_n: 50
    final_k: 50
    passage_max_chars: 300
    concurrency: 4
    model: ""
  expander:
    seed_top_n: 5
    neighbor_window: 2
    max_context_chars: 8000
  telegram:
    safe_limit_chars: 600
    max_parts: 3

llm:
  base_url: ""
  api_key: ""
  model: ""
  fallback_model: ""
  temperature: 0.2
  max_tokens: 400

embeddings:
  provider: fake
  base_url: ""
  api_key: ""
  model: ""
  batch_size: 64

telegram:
  bot_token: ""
  api_base_url: http://api:8000
