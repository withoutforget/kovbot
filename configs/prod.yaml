env: prod
logging:
  level: INFO

postgres:
  dsn: postgresql+asyncpg://${POSTGRES_USER:-kov}:${POSTGRES_PASSWORD:-kov}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-kov}

qdrant:
  url: ${QDRANT_URL:-http://qdrant:6333}
  collection: kov_chunks
  vector_size: 64
  timeout_seconds: ${QDRANT_TIMEOUT_SECONDS:-120}
  upsert_batch_size: ${QDRANT_UPSERT_BATCH_SIZE:-64}

s3:
  endpoint_url: ${S3_ENDPOINT_URL:-http://minio:9000}
  access_key: ${S3_ACCESS_KEY:-minioadmin}
  secret_key: ${S3_SECRET_KEY:-minioadmin}
  bucket: ${S3_BUCKET:-kov-artifacts}
  region: ${S3_REGION:-us-east-1}

rag_scan:
  pipeline_version: "1.0"
  chunking:
    mode: ${RAG_SCAN_CHUNKING_MODE:-semantic}
    max_chars: 1200
    overlap_chars: 120
    strip_repeated_headers_footers: ${RAG_SCAN_STRIP_HEADERS_FOOTERS:-true}
    drop_low_signal_paragraphs: ${RAG_SCAN_DROP_LOW_SIGNAL:-true}
    min_alpha_chars: ${RAG_SCAN_MIN_ALPHA_CHARS:-20}

rag_search:
  pipeline_version: "1.0"
  planner:
    max_queries: 20
    use_llm: ${RAG_SEARCH_PLANNER_USE_LLM:-true}
    model: ${RAG_SEARCH_PLANNER_MODEL:-}
    max_tokens: ${RAG_SEARCH_PLANNER_MAX_TOKENS:-800}
  retrieval:
    top_k_per_query: 10
    min_score: 0.0
  reranker:
    enabled: ${RAG_SEARCH_RERANKER_ENABLED:-true}
    mode: ${RAG_SEARCH_RERANKER_MODE:-list}
    top_n: ${RAG_SEARCH_RERANKER_TOP_N:-100}
    final_k: ${RAG_SEARCH_RERANKER_FINAL_K:-100}
    passage_max_chars: ${RAG_SEARCH_RERANKER_PASSAGE_MAX_CHARS:-800}
    concurrency: ${RAG_SEARCH_RERANKER_CONCURRENCY:-8}
    model: ${RAG_SEARCH_RERANKER_MODEL:-}
  expander:
    seed_top_n: 10
    neighbor_window: 5
    max_context_chars: 24000
  telegram:
    safe_limit_chars: 3900
    max_parts: 3

llm:
  base_url: ${LLM_BASE_URL:-}
  api_key: ${LLM_API_KEY:-}
  model: ${LLM_MODEL:-}
  fallback_model: ${LLM_FALLBACK_MODEL:-}
  temperature: 0.2
  max_tokens: ${LLM_MAX_TOKENS:-2500}

embeddings:
  provider: ${EMBEDDINGS_PROVIDER:-fake}
  base_url: ${EMBEDDINGS_BASE_URL:-}
  api_key: ${EMBEDDINGS_API_KEY:-}
  model: ${EMBEDDINGS_MODEL:-}
  batch_size: ${EMBEDDINGS_BATCH_SIZE:-64}

telegram:
  bot_token: ${TELEGRAM_BOT_TOKEN:-}
  api_base_url: http://api:8000
